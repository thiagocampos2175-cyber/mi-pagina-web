r-emerald-400/40 text-emerald-200 text-xs font-semibold text-center animate-in fade-in",children:n})]})]})};var Dd=_(Ht(),1);var Mn=[{id:1,question:"\xBFPor qu\xE9 las tiazidas causan hiponatremia severa con mayor frecuencia que los diur\xE9ticos de asa en adultos mayores?",options:["Porque las tiazidas destruyen el gradiente c\xF3rtico-medular osm\xF3tico en el asa de Henle.","Porque inhiben el NCC en el t\xFAbulo distal cortical pero preservan el gradiente medular, permitiendo que la ADH siga reabsorbiendo agua libre.","Porque aumentan directamente la secreci\xF3n hipofisaria de oxitocina y aldosterona.","Porque bloquean por completo la filtraci\xF3n de sodio en el glom\xE9rulo."],correctIndex:1,explanation:"Las tiazidas bloquean el cotransportador NCC en el t\xFAbulo contorneado distal (segmento dilutorio). Como el gradiente c\xF3rtico-medular del asa de Henle queda intacto, la vasopresina (ADH) puede actuar en el t\xFAbulo colector reabsorbiendo agua libre sobre una orina que no puede diluirse, generando hiponatremia dilucional.",sourceCase:"Caso 1 \xB7 Tiazidas (La abuelita confundida)"},{id:2,question:"Un paciente con insuficiencia cardiaca en furosemida toma ibuprofeno y gentamicina. \xBFQu\xE9 par de consecuencias farmacol\xF3gicas directas ocurrir\xE1n?",options:["Alcalosis respiratoria y fibrosis pulmonar por aumento de prostaglandinas.","El AINE potencia la diuresis al abrir canales ENaC y la gentamicina previene la ototoxicidad.","El AINE anula la diuresis (compite por transportador OAT y suprime prostaglandinas) y la gentamicina sinergiza da\xF1o coclear irreversible.","Hipotensi\xF3n severa instant\xE1nea y p\xE9rdida masiva de glucosa por orina."],correctIndex:2,explanation:"Los AINEs compiten con la furosemida por la secreci\xF3n tubular proximal mediada por OAT y bloquean la s\xEDntesis de prostaglandinas vasodilatadoras renales. La combinaci\xF3n de furosemida con aminogluc\xF3sidos lesiona la estr\xEDa vascular e induce ototoxicidad sin\xE9rgica grave.",sourceCase:"Caso 2 \xB7 De Asa (El triple combo)"},{id:3,question:"En una paciente con HTA resistente (triple esquema \xF3ptimo), \xBFcu\xE1l es el 4.\xBA f\xE1rmaco de elecci\xF3n seg\xFAn el ensayo PATHWAY-2 y c\xF3mo manejas la mastodinia?",options:["Doxazosina; si hay mastodinia, cambiar a prazosina.","Espironolactona; si presenta mastodinia, sustituir por eplerenona (antagonista mineralocorticoide selectivo).","Metildopa; si hay mastodinia, agregar progesterona sint\xE9tica.","Aliskireno; si hay mastodinia, suspender la clortalidona."],correctIndex:1,explanation:"El ensayo PATHWAY-2 demostr\xF3 que la espironolactona es el f\xE1rmaco m\xE1s eficaz como cuarto escal\xF3n. Como es un esteroide no selectivo que antagoniza andr\xF3genos y estimula progest\xE1genos, genera dolor mamario y ginecomastia; la eplerenona es el reemplazo de alta selectividad mineralocorticoide.",sourceCase:"Caso 3 \xB7 Ahorradores de K\u207A (Resistente pero fr\xE1gil)"},{id:4,question:"Al iniciar enalapril en un paciente con nefropat\xEDa diab\xE9tica, la creatinina s\xE9rica se eleva un 20%. \xBFCu\xE1l es la interpretaci\xF3n fisiopatol\xF3gica correcta?",options:["Es necrosis tubular aguda t\xF3xica; se debe suspender inmediatamente el IECA.","Es un efecto hemodin\xE1mico esperado por vasodilataci\xF3n de la arteriola eferente; elevaciones \u226430% no justifican suspender el f\xE1rmaco.","Es se\xF1al de estenosis a\xF3rtica severa que requiere cirug\xEDa valvular de urgencia.","Indica que debe agregarse de inmediato un ARA-II para revertir la vasoconstricci\xF3n."],correctIndex:1,explanation:"La angiotensina II vasoconstri\xF1e la arteriola eferente. Los IECA al vasodilatarla reducen la presi\xF3n intraglomerular; esto protege contra la esclerosis a largo plazo, con una elevaci\xF3n funcional benigna esperable de hasta un 30% en la creatinina s\xE9rica.",sourceCase:"Caso 4 \xB7 IECA y ARA-II (La tos que no se quita)"},{id:5,question:"\xBFQu\xE9 demostr\xF3 categ\xF3ricamente el ensayo cl\xEDnico ONTARGET respecto a la combinaci\xF3n simult\xE1nea de un IECA con un ARA-II?",options:["Redujo la mortalidad cardiovascular en un 50% con excelente tolerancia renal.","Provoc\xF3 regresi\xF3n completa de la aterosclerosis carot\xEDdea.","No confiri\xF3 beneficio cardiovascular adicional y aument\xF3 significativamente el riesgo de hiperpotasemia, s\xEDncope y deterioro renal agudo.","Fue la combinaci\xF3n de primera l\xEDnea recomendada para todo paciente hipertenso."],correctIndex:2,explanation:"El ensayo ONTARGET (NEJM 2008) compar\xF3 ramipril, telmisart\xE1n o ambos: el bloqueo dual no aport\xF3 beneficio adicional y duplic\xF3 la incidencia de hiperpotasemia y disfunci\xF3n renal aguda. Est\xE1 formalmente contraindicado.",sourceCase:"Caso 4 \xB7 IECA y ARA-II (La tos que no se quita)"},{id:6,question:"\xBFCu\xE1nto tiempo obligatorio de ventana de lavado debe transcurrir entre la \xFAltima dosis de un IECA y la primera toma de sacubitril/valsart\xE1n (ARNI)?",options:["No se requiere intervalo; pueden iniciarse simult\xE1neamente en la misma toma.","Exactamente 4 horas.","Al menos 36 horas completas para permitir el aclaramiento de la inhibici\xF3n de la cininasa II y prevenir angioedema letal.","7 d\xEDas completos en r\xE9gimen intrahospitalario estricto."],correctIndex:2,explanation:"Tanto la ECA (cininasa II) como la neprilisina degradan la bradicinina. Bloquear ambas simult\xE1neamente genera una acumulaci\xF3n explosiva de bradicinina en tejido orofar\xEDngeo, desencadenando angioedema severo de v\xEDa a\xE9rea. La ventana obligatoria de lavado es de m\xEDnimo 36 horas.",sourceCase:"Caso 5 \xB7 ARNI y Aliskireno (El cambio apresurado)"},{id:7,question:"\xBFPor qu\xE9 el edema maleolar provocado por amlodipino no responde adecuadamente al tratamiento con diur\xE9ticos?",options:["Porque se debe a insuficiencia renal an\xFArica terminal inducida por el f\xE1rmaco.","Porque es un edema por aumento de presi\xF3n hidrost\xE1tica capilar localizado (dilataci\xF3n arteriolar precapilar sin dilataci\xF3n venular) y no por hipervolemia sist\xE9mica.","Porque el amlodipino bloquea los receptores de vasopresina en el t\xFAbulo proximal.","Porque el amlodipino destruye f\xEDsicamente los vasos linf\xE1ticos de las extremidades inferiores."],correctIndex:1,explanation:"Las dihidropiridinas relajan selectivamente el esf\xEDnter precapilar arteriolar pero no el lecho venular postcapilar, aumentando la presi\xF3n hidrost\xE1tica dentro del capilar y forzando la trasudaci\xF3n de l\xEDquido al tejido intersticial. No hay exceso de volumen corporal total; dar diur\xE9ticos solo deshidrata a la paciente.",sourceCase:"Caso 6 \xB7 Calcioantagonistas (Tobillos y frecuencia)"},{id:8,question:"En un paciente con fibrilaci\xF3n auricular que toma metoprolol, \xBFpor qu\xE9 es una grave contraindicaci\xF3n prescribir verapamilo?",options:["Porque el metoprolol destruye qu\xEDmicamente al verapamilo en el est\xF3mago impidiendo su absorci\xF3n.","Porque causa alcalosis metab\xF3lica refractaria y convulsiones t\xF3nico-cl\xF3nicas.","Porque ambos deprimen fuertemente el nodo sinusal y el nodo auriculoventricular, generando riesgo inminente de bradicardia severa, paro o bloqueo AV completo.","Porque estimulan de forma masiva los receptores beta-2 produciendo broncodilataci\xF3n excesiva."],correctIndex:2,explanation:"Tanto el verapamilo (no-DHP con tropismo mioc\xE1rdico nodal) como el metoprolol (betabloqueador) tienen potentes efectos inotr\xF3picos, cronotr\xF3picos y dromotr\xF3picos negativos. Su asociaci\xF3n puede desencadenar bloqueo AV completo de tercer grado o choque cardiog\xE9nico.",sourceCase:"Caso 6 \xB7 Calcioantagonistas (Tobillos y frecuencia)"},{id:9,question:"Ante la sospecha fundada de un feocromocitoma con crisis hipertensiva y taquicardia, \xBFcu\xE1l es el principio farmacol\xF3gico inquebrantable?",options:["Administrar inmediatamente propranolol en monoterapia para frenar la taquicardia sinusal.",'Primero bloquear receptores alfa (doxazosina/fenoxibenzamina) y SOLO DESPU\xC9S iniciar el betabloqueador (regla alfab\xE9tica: "A" antes de "B").',"Administrar infusi\xF3n de adrenalina a dosis altas para saturar receptores.","Iniciar de inmediato clonidina intravenosa en bolo r\xE1pido."],correctIndex:1,explanation:'Si se da un betabloqueador solo, se bloquea la vasodilataci\xF3n beta-2 y se deja la carga masiva de catecolaminas actuando sin oposici\xF3n sobre los receptores vasculares alfa-1 ("un-opposed alpha stimulation"), disparando la presi\xF3n a niveles catastr\xF3ficos. Regla nemot\xE9cnica: "A" antes de "B".',sourceCase:"Caso 7 \xB7 Betabloqueadores y alfa1 (Las crisis misteriosas)"},{id:10,question:"\xBFQu\xE9 cuadro fisiopatol\xF3gico desencadena la suspensi\xF3n abrupta de clonidina y qu\xE9 f\xE1rmaco directo se asocia a lupus con anticuerpos antihistona en acetiladores lentos?",options:["Crisis de abstinencia por hipocortisolismo; nitroprusiato en acetiladores r\xE1pidos.","Tormenta simp\xE1tica hiperadren\xE9rgica por noradrenalina acumulada y receptores supersensibles; hidralazina en acetiladores lentos.","Hipotensi\xF3n ortost\xE1tica fulminante con bradicardia extrema; minoxidil en acetiladores intermedios.","Coma mixedematoso por bloqueo tiroideo; amilorida en fenotipos NAT1."],correctIndex:1,explanation:"La clonidina mantiene suprimida la liberaci\xF3n de noradrenalina. Al retirarla bruscamente, se liberan cantidades masivas de catecolaminas que impactan sobre receptores hiperreactivos provocando hipertensi\xF3n de rebote fulminante. Por su parte, la hidralazina cr\xF3nica causa lupus farmacoinducido (con anticuerpos antihistona) preferentemente en pacientes con acetilaci\xF3n hep\xE1tica lenta.",sourceCase:"Caso 8 \xB7 Centrales y Vasodilatadores directos (La suspensi\xF3n abrupta)"}];var w=_(nt(),1),ts=()=>{let[t,a]=(0,Dd.useState)({}),[r,e]=(0,Dd.useState)(!1),i=Mn.length,o=Object.keys(t).length,n=(v,x)=>{if(t[v]!==void 0)return;let s={... -300",children:[u.percentage,"%"]})]})]}),(0,w.jsx)("div",{children:(0,w.jsxs)("button",{type:"button",onClick:l,className:"px-6 py-2.5 bg-white text-neutral-900 hover:bg-neutral-100 font-bold text-xs rounded-xl transition-all shadow-md active:scale-95 inline-flex items-center gap-1.5",children:[(0,w.jsx)(We,{className:"w-3.5 h-3.5"}),(0,w.jsx)("span",{children:"Intentar de nuevo para ganar m\xE1s Aura"})]})})]})]})};var as=[{teamId:1,familyTitle:"EQUIPO 1 \xB7 TIAZIDAS Y SIMILARES",codename:"La abuelita confundida",vignette:"Mujer de 79 a\xF1os de edad que inici\xF3 tratamiento con clortalidona hace 3 semanas por hipertensi\xF3n arterial sist\xF3lica aislada. Acude tra\xEDda por familiares por presentar somnolencia progresiva, desorientaci\xF3n y letargia. En los ex\xE1menes de laboratorio de ingreso se documenta: Na\u207A s\xE9rico 121 mEq/L y K\u207A s\xE9rico 3.2 mEq/L.",patientData:{age:"79 a\xF1os",keyLab:"Na\u207A 121 mEq/L (severo) | K\u207A 3.2 mEq/L",clinicalFinding:"Somnolencia progresiva y confusi\xF3n 3 semanas tras iniciar clortalidona"},guideQuestions:["\xBFPor qu\xE9 las tiazidas causan hiponatremia con mucha mayor frecuencia y gravedad que los diur\xE9ticos de asa?","\xBFCu\xE1l es la conducta terap\xE9utica inmediata: qu\xE9 f\xE1rmaco suspendes, c\xF3mo corriges los electrolitos y qu\xE9 familia antihipertensiva alternativa seleccionas?"],expectedAnswer:{diagnosis:"Hiponatremia hipot\xF3nica dilucional severa e hipopotasemia inducidas por tiazidas.",pharmacologicalMechanism:"Las tiazidas inhiben el cotransportador NCC en el t\xFAbulo contorneado distal, el cual es un segmento cortical dilutorio. Al bloquear la reabsorci\xF3n de solutos all\xED, impiden que la orina se diluya normalmente, PERO no alteran el gradiente osm\xF3tico c\xF3rtico-medular generado en el asa de Henle. Por tanto, ante la liberaci\xF3n fisiol\xF3gica de vasopresina (ADH), el t\xFAbulo colector sigue reabsorbiendo agua libre de forma masiva sobre una orina incapaz de diluirse, precipitando una profunda hiponatremia dilucional (los diur\xE9ticos de asa, al destruir el gradiente medular, impiden concentrar la orina y causan menos hiponatremia).",actionPlan:`1. Suspender de inmediato la clortalidona.
2. Corregir el sodio con cautela estricta (no superar 8 mEq/L en 24 h para prevenir s\xEDndrome de desmielinizaci\xF3n osm\xF3tica).
3. Reponer K\u207A y vigilar Mg\xB2\u207A (la hipomagnesemia dificulta la correcci\xF3n del potasio).
4. Cambiar a una familia alternativa segura para esta paciente: calcioantagonista dihidropirid\xEDnico (p. ej., amlodipino) o IECA/ARA-II.`,evidenceNotes:"Gu\xEDa AHA/ACC 2025: la clortalidona es potente y de vida media prolongada, pero exige control electrol\xEDtico a las 2\u20134 semanas, especialmente en mujeres ancianas de bajo peso."},callouts:{explicacion:'El t\xFAbulo contorneado distal aporta el "agua libre de solutos". Si bloqueas el NCC mantienes el gradiente medular intacto; la ADH reabsorbe agua pura mientras pierdes sodio. Resultado: hiponatremia dilucional severa en la paciente geri\xE1trica.',mnemotecnia:'TIAZIDAS = "TIA-SIN-SODIO": T\xEDa anciana que pierde Na\u207A, K\u207A y Mg\xB2\u207A, pero retiene \xC1cido \xFArico, Calcio y Glucosa ("Hiper-UCG").',redFlag:"\xA1Alerta roja! Hiponatremia aguda sintom\xE1tica en adultos mayores. Nunca corrijas el sodio a m\xE1s de 8 mEq/L en 24 horas por riesgo de mielin\xF3lisis p\xF3ntica central."}},{teamId:2,familyTitle:"EQUIPO 2 \xB7 DIUR\xC9TICOS DE ASA",codename:"El triple combo",vignette:"Hombre de 70 a\xF1os con diagn\xF3stico de insuficiencia cardiaca cr\xF3nica en tratamiento habitual con furosemida. Por presentar dolor incapacitante por gonartrosis, automedica ibuprofeno oral. Simult\xE1neamente, por un cuadro infeccioso urinario complicado, recibe gentamicina intravenosa. A los 5 d\xEDas el paciente refiere marcada disminuci\xF3n del volumen urinario matutino (oliguria) y sensaci\xF3n molesta de zumbido de o\xEDdos (tinnitus bilateral).",patientData:{age:"70 a\xF1os",keyLab:"Oliguria aguda, elevaci\xF3n de azoados, zumbido de o\xEDdos bilateral",clinicalFinding:"Furosemida + Ibuprofeno (AINE) + Gentamicina (aminogluc\xF3sido)"},guideQuestions:["Explica el mecanismo fisiopatol\xF3gico y farmacol\xF3gico por el cual el ibuprofeno anul\xF3 el efecto de la furosemida.","Explica el mecanismo molecular de la toxicidad auditiva y renal generada por la combinaci\xF3n de furosemida + gentamicina, y define la conducta terap\xE9utica."],expectedAnswer:{diagnosis:"Lesi\xF3n renal aguda farmacol\xF3gica, resistencia a diur\xE9ticos y ototoxicidad bilateral sin\xE9rgica.",pharmacologicalMechanism:`1. Interacci\xF3n Furosemida + AINE: La furosemida requiere ser secretada activamente al lumen tubular por transportadores de aniones org\xE1nicos (OAT) en el t\xFAbulo proximal; los AINEs compiten fuertemente por este transportador, reduciendo la concentraci\xF3n luminal del diur\xE9tico. Adem\xE1s, la furosemida induce la s\xEDntesis renal de prostaglandinas vasodilatadoras (PGE\u2082 y PGI\u2082); los AINEs bloquean la COX-1/COX-2, suprimiendo las prostaglandinas, provocando vasoconstricci\xF3n de la arteriola aferente, ca\xEDda del filtrado glomerular y retenci\xF3n de sodio/agua.
2. Furosemida + Gentamicina: Ambos f\xE1rmacos son otot\xF3xicos y nefrot\xF3xicos. La furosemida altera la estr\xEDa vascular coclear y aumenta la permeabilidad de la membrana endolinf\xE1tica, facilitando la entrada masiva del aminogluc\xF3sido a las c\xE9lulas ciliadas sensoriales del o\xEDdo interno, sinergizando la apoptosis celular coclear y vestibular irreversible.`,actionPlan:`1. Suspender de inmediato el AINE (ibuprofeno).
2. Suspender y cambiar la gentamicina por un antibi\xF3tico no otot\xF3xico/no nefrot\xF3xico seg\xFAn antibiograma.
3. Monitorizar de forma seriada creatinina, electrolitos s\xE9ricos (K\u207A, Mg\xB2\u207A, Ca\xB2\u207A) y valorar audiometr\xEDa cl\xEDnica.
4. Ajustar el soporte diur\xE9tico de la insuficiencia cardiaca con vigilancia estrecha de la volemia.`,evidenceNotes:"Goodman & Gilman (14.\xAA ed.) y gu\xEDas AHA/HFSA 2022: los AINEs est\xE1n proscritos en insuficiencia cardiaca por precipitar descompensaciones agudas y bloquear la respuesta a diur\xE9ticos."},callouts:{explicacion:"La furosemida necesita prostaglandinas para abrir la arteriola aferente y entrar al t\xFAbulo por OAT. El ibuprofeno le cierra la puerta. La gentamicina aprovecha la alteraci\xF3n de la estr\xEDa vascular que causa la furosemida para destruir las c\xE9lulas ciliadas del o\xEDdo.",mnemotecnia:'ASA = "A-S-A": Asfixia auditiva (ototoxicidad con aminogluc\xF3sidos) + Supresi\xF3n por AINEs + Aniones perdidos (K\u207A, Mg\xB2\u207A, Ca\xB2\u207A).',redFlag:"\xA1Alerta roja! Jam\xE1s juntes furosemida a dosis altas con aminogluc\xF3sidos en ancianos, ni permitas AINEs en insuficiencia cardiaca. Tinnitus = da\xF1o coclear en progreso."}},{teamId:3,familyTitle:"EQUIPO 3 \xB7 AHORRADORES DE K\u207A",codename:"Resistente pero fr\xE1gil",vignette:"Mujer de 62 a\xF1os con diagn\xF3stico de hipertensi\xF3n resistente. A pesar de recibir dosis plenas optimizadas de amlodipino + losart\xE1n + clortalidona con apego confirmado, su PA se mantiene en 155/95 mmHg. Sus paracl\xEDnicos basales muestran: Tasa de Filtrado Glomerular estimada (TFGe) de 45 mL/min/1.73m\xB2 y K\u207A s\xE9rico de 4.6 mEq/L. Siguiendo las gu\xEDas, su m\xE9dico agrega espironolactona 25 mg/d\xEDa. Cuatro meses despu\xE9s la paciente acude por dolor e hipersensibilidad bilateral en gl\xE1ndulas mamarias (mastodinia severa).",patientData:{age:"62 a\xF1os",keyLab:"TFGe 45 mL/min/1.73m\xB2 | K\u207A inicial 4.6 mEq/L",clinicalFinding:"HTA resistente tratada con triple terapia \xF3ptima; mastodinia intensa tras a\xF1adir espironolactona"},guideQuestions:["\xBFPor qu\xE9 la espironolactona es el f\xE1rmaco de elecci\xF3n indiscutible en hipertensi\xF3n resistente seg\xFAn el ensayo PATHWAY-2?","\xBFQu\xE9 par\xE1metros de laboratorio debieron vigilarse estrictamente y en qu\xE9 fechas exactas?","\xBFQu\xE9 modificaci\xF3n farmacol\xF3gica espec\xEDfica resuelve la mastodinia manteniendo el control tensional?"],expectedAnswer:{diagnosis:"Hipertensi\xF3n arterial resistente con control alcanzado mediante antagonista de receptor mineralocorticoide, complicada con efecto adverso endocrino (mastodinia).",pharmacologicalMechanism:"En hipertensi\xF3n resistente suele existir un estado de exceso relativo o retenci\xF3n de sodio mediada por aldosterona. El ensayo cl\xEDnico PATHWAY-2 demostr\xF3 que la espironolactona es el cuarto f\xE1rmaco m\xE1s efectivo comparado con placebo, bisoprolol o doxazosina. Sin embargo, la espironolactona no es selectiva: antagoniza receptores de andr\xF3genos e interact\xFAa con receptores de progesterona, ocasionando mastodinia, ginecomastia y trastornos menstruales.",actionPlan:`1. Plan de vigilancia obligado: Con TFGe de 45 y K\u207A basal de 4.6, el riesgo de hiperpotasemia fatal es muy elevado. Se debe monitorizar K\u207A y creatinina s\xE9rica antes de iniciar, a la 1.\xAA semana, a la 4.\xAA semana y luego peri\xF3dicamente (cada 3-6 meses).
2. Cambio terap\xE9utico: Suspender espironolactona y cambiar a EPLERENONA (antagonista mineralocorticoide de segunda generaci\xF3n, altamente selectivo por el receptor de aldosterona, sin afinidad significativa por receptores androg\xE9nicos ni progest\xE1genos, resolviendo la mastodinia).`,evidenceNotes:"Ensayo PATHWAY-2 (Lancet 2015): espironolactona supera a todas las dem\xE1s opciones como cuarto f\xE1rmaco. Si hay efectos adversos antiandrog\xE9nicos, la eplerenona es el reemplazo de primera l\xEDnea."},callouts:{explicacion:'La espironolactona bloquea la aldosterona en el t\xFAbulo colector, pero su estructura esteroidea sucia "toca" receptores de testosterona y progesterona provocando ginecomastia y dolor mamario. La eplerenona es la versi\xF3n quir\xFArgica y selectiva.',mnemotecnia:'ESPIRONOLACTONA vs EPLERENONA: Espirono "Lacta" (dolor de mamas y ginecomastia). Eplerenona = "Elegante y Pura" (selectiva, sin drama mamario).',redFlag:"\xA1Alerta roja! Espironolactona con TFGe <45 o K\u207A >4.5 mEq/L combinada con ARA-II puede disparar el potasio a >6.0 mEq/L r\xE1pidamente. Vigila al d\xEDa 7 y al d\xEDa 30."}},{teamId:4,familyTitle:"EQUIPO 4 \xB7 IECA Y ARA-II",codename:"La tos que no se quita",vignette:'Hombre de 58 a\xF1os con diabetes mellitus tipo 2 y albuminuria persistente confirmada, en manejo con enalapril 10 mg cada 12 h. Acude a consulta refiriendo tos seca, espasm\xF3dica, sin expectoraci\xF3n, predominio nocturno, que inici\xF3 hace 2 meses y le impide dormir. Adem\xE1s, en su laboratorio de control a las 2 semanas del inicio, la creatinina s\xE9rica subi\xF3 de 1.0 a 1.20 mg/dL (un incremento del 20%). Su m\xE9dico de primer contacto propone agregar losart\xE1n 50 mg al enalapril para "potenciar la nefroprotecci\xF3n diab\xE9tica".',patientData:{age:"58 a\xF1os",keyLab:"Creatinina subi\xF3 de 1.0 a 1.20 mg/dL (+20%) | Albuminuria positiva",clinicalFinding:"Tos seca nocturna de 2 meses por enalapril; propuesta m\xE9dica de a\xF1adir losart\xE1n"},guideQuestions:["\xBFEl aumento del 20% en la creatinina es motivo justificado para suspender el IECA? Explica el fen\xF3meno hemodin\xE1mico glomerular.","\xBFA qu\xE9 se debe exactamente la tos seca? \xBFQu\xE9 conducta tomas con el enalapril y qu\xE9 opinas de la propuesta de agregar losart\xE1n apoy\xE1ndote en el ensayo ONTARGET?"],expectedAnswer:{diagnosis:"Efecto de clase hemodin\xE1mico benigno del IECA sobre el glom\xE9rulo, tos inducida por bradicinina y propuesta err\xF3nea de bloqueo dual del SRAA.",pharmacologicalMechanism:`1. Creatinina: La angiotensina II vasoconstri\xF1e selectivamente la arteriola eferente para mantener la presi\xF3n de filtraci\xF3n glomerular. Al inhibir la ECA, el enalapril vasodilata la arteriola eferente, disminuyendo la presi\xF3n intraglomerular (lo cual a largo plazo frena la esclerosis y la albuminuria). Una elevaci\xF3n de creatinina \u226430% respecto al valor basal es una respuesta hemodin\xE1mica esperable y benigna; NO es motivo para suspender el f\xE1rmaco.
2. Tos: La ECA es id\xE9ntica a la Cininasa II, enzima encargada de degradar la bradicinina y la sustancia P en las v\xEDas respiratorias. Al inhibirla, la bradicinina se acumula en el epitelio bronquial estimulando fibras C sensitivas.
3. Bloqueo dual (IECA + ARA-II): Totalmente contraindicado. El estudio ONTARGET demostr\xF3 que combinar enalapril/ramipril con un ARA-II no aporta reducci\xF3n de eventos cardiovasculares ni renales y en cambio duplica el riesgo de hiperpotasemia, s\xEDncope y lesi\xF3n renal aguda.`,actionPlan:`1. Suspender el enalapril debido a la tos refractaria.
2. Cambiar por monoterapia con un ARA-II (p. ej., losart\xE1n o telmisart\xE1n), el cual bloquea AT\u2081 sin inhibir la degradaci\xF3n de bradicinina.
3. Rechazar rotundamente la combinaci\xF3n simult\xE1nea de IECA + ARA-II.
4. Mantener la vigilancia de creatinina y potasio en 2-4 semanas.`,evidenceNotes:"Ensayo ONTARGET (NEJM 2008): el bloqueo dual del SRAA no confiere beneficio y multiplica los eventos adversos graves."},callouts:{explicacion:"El glom\xE9rulo necesita que la arteriola eferente est\xE9 cerrada para tener presi\xF3n de filtrado. El IECA la abre, baja la presi\xF3n (salvando el ri\xF1\xF3n a largo plazo) pero sube transitoriamente la creatinina hasta un 30%. Si tose, es bradicinina: cambias a ARA-II, pero nunca sumas los dos.",mnemotecnia:'IECA = "Inhibe Cininasa \u2192 Acumula Tos". Si tose, c\xE1mbialo a SART\xC1N. "ONTARGET" = Prohibido duplicar el dardo al SRAA.',redFlag:"\xA1Alerta roja! Nunca combines IECA con ARA-II. Es una de las red flags farmacol\xF3gicas m\xE1s castigadas en medicina: sin beneficio cl\xEDnico y con alto riesgo de inducir fallo renal e hiperpotasemia."}},{teamId:5,familyTitle:"EQUIPO 5 \xB7 ARNI Y ALISKIRENO",codename:"El cambio apresurado",vignette:'Paciente de 64 a\xF1os con insuficiencia cardiaca con fracci\xF3n de eyecci\xF3n reducida (ICFEr 30%) que se encuentra hospitalizado recibiendo enalapril 10 mg cada 12 h. Durante la entrega de guardia nocturna, el m\xE9dico residente decide optimizar el tratamiento m\xE9dico guiado por gu\xEDas y prescribe iniciar sacubitril/valsart\xE1n esa misma noche (apenas 4 horas despu\xE9s de la dosis vespertina de enalapril). Adem\xE1s, con la intenci\xF3n de "bloquear por completo la cascada desde su origen", propone agregar aliskireno por la ma\xF1ana.',patientData:{age:"64 a\xF1os",keyLab:"ICFEr FEVI 30%",clinicalFinding:"Prescripci\xF3n de Sacubitril/valsart\xE1n 4 h post-enalapril + propuesta de aliskireno"},guideQuestions:["\xBFCu\xE1l es el peligro de administrar sacubitril/valsart\xE1n sin respetar la ventana de lavado tras el IECA y qu\xE9 tiempo exacto exige la farmacovigilancia?","\xBFQu\xE9 evidencia cient\xEDfica existe sobre asociar aliskireno a un bloqueador del SRAA seg\xFAn el ensayo ALTITUDE?"],expectedAnswer:{diagnosis:"Riesgo inminente de angioedema potencialmente fatal por solapamiento de inhibidores de cininas, y contraindicaci\xF3n de bloqueo con aliskireno.",pharmacologicalMechanism:`1. Riesgo de Angioedema por Sacubitril/valsart\xE1n + IECA: Tanto la ECA (cininasa II) como la neprilisina son las dos principales peptidasas responsables de degradar la bradicinina y la sustancia P. Si se administra sacubitril (inhibidor de neprilisina) mientras la ECA sigue inhibida por enalapril, se produce una acumulaci\xF3n explosiva y masiva de bradicinina en el tejido submucoso orofar\xEDngeo, desencadenando angioedema lar\xEDngeo fulminante y asfixia. Se requiere obligatoriamente un periodo de lavado libre de f\xE1rmaco de al menos 36 HORAS tras la \xFAltima toma del IECA antes de ingerir la primera dosis de sacubitril/valsart\xE1n.
2. Aliskireno combinado: El ensayo cl\xEDnico ALTITUDE evalu\xF3 aliskireno (inhibidor directo de renina) a\xF1adido a pacientes que ya recib\xEDan IECA o ARA-II; el estudio tuvo que ser suspendido prematuramente porque el grupo con aliskireno present\xF3 aumento significativo de eventos adversos graves: hiperpotasemia severa, hipotensi\xF3n refractaria, fallo renal e incremento en ictus sin beneficio cardiovascular.`,actionPlan:`1. Cancelar de inmediato la orden de sacubitril/valsart\xE1n para esa noche.
2. Programar una ventana de descanso de 36 horas completas desde la \xFAltima toma del enalapril antes de dosificar el ARNI.
3. Descartar definitivamente el aliskireno en este paciente.
4. Informar al equipo de enfermer\xEDa sobre signos precoces de angioedema y monitorizar presi\xF3n arterial.`,evidenceNotes:"Gu\xEDas AHA/HFSA 2022 y ensayo ALTITUDE (NEJM 2012): la regla de oro de las 36 horas es mandato de seguridad clase I, y el aliskireno combinado est\xE1 estrictamente desaconsejado."},callouts:{explicacion:"Tanto la ECA como la neprilisina destruyen la bradicinina. Si bloqueas la ECA con enalapril y el sacubitril bloquea la neprilisina a la vez, la bradicinina inunda la v\xEDa a\xE9rea: el paciente hace angioedema de lengua y glotis.",mnemotecnia:'ARNI = "Agua de 36 Horas": Espera 36 h de reloj tras el "-pril". ALTITUDE = Aliskireno te tumba si lo combinas.',redFlag:"\xA1Alerta roja letal! Administrar sacubitril/valsart\xE1n menos de 36 horas despu\xE9s de un IECA es negligencia grave. El angioedema de v\xEDa a\xE9rea superior compromete la vida en minutos."}},{teamId:6,familyTitle:"EQUIPO 6 \xB7 CALCIOANTAGONISTAS",codename:"Tobillos y frecuencia",vignette:'Mujer de 66 a\xF1os con antecedente de hipertensi\xF3n arterial y fibrilaci\xF3n auricular permanente. Se encuentra bajo tratamiento con amlodipino 10 mg/d\xEDa y metoprolol succinato 100 mg/d\xEDa para control de frecuencia cardiaca (FC en reposo: 72 lpm). Desarrolla edema maleolar bilateral sim\xE9trico, blando e indoloro, de predominio vespertino. Su m\xE9dico de atenci\xF3n m\xE9dica primaria sospecha "retenci\xF3n de l\xEDquido" y valora cambiar el amlodipino por verapamilo 240 mg/d\xEDa para resolver el edema y de paso "apoyar el ritmo cardiaco".',patientData:{age:"66 a\xF1os",keyLab:"FC 72 lpm | Edema maleolar ++/++++ bilateral vespertino",clinicalFinding:"Amlodipino 10 mg + Metoprolol 100 mg; propuesta de cambio a Verapamilo"},guideQuestions:["\xBFPor qu\xE9 el edema por dihidropiridinas (amlodipino) NO responde a diur\xE9ticos y cu\xE1l es su mecanismo fisiopatol\xF3gico?","\xBFPor qu\xE9 sustituir amlodipino por verapamilo en una paciente que ya toma metoprolol representa una contraindicaci\xF3n formal y un grave peligro hemodin\xE1mico?"],expectedAnswer:{diagnosis:"Edema arteriolar dependiente de dihidropiridinas e interacci\xF3n farmacol\xF3gica peligrosa por sinergia inotr\xF3pica y dromotr\xF3pica negativa (verapamilo + betabloqueador).",pharmacologicalMechanism:`1. Fisiopatolog\xEDa del edema maleolar: El amlodipino produce vasodilataci\xF3n preferencial y potente del esf\xEDnter precapilar arteriolar sin dilatar de forma equitativa el lecho postcapilar venular. Esto incrementa de manera selectiva la presi\xF3n hidrost\xE1tica dentro del capilar perimaleolar, forzando la trasudaci\xF3n de l\xEDquido al intersticio por gradiente de Starling. Como NO se debe a una hipervolemia sist\xE9mica ni a retenci\xF3n renal de sodio, los diur\xE9ticos son ineficaces y pueden inducir hipovolemia. La adici\xF3n de un IECA o ARA-II vasodilata el lecho venular postcapilar, normaliza la presi\xF3n intraglomerular capilar y reduce notablemente el edema.
2. Riesgo Verapamilo + Metoprolol: El verapamilo es un calcioantagonista no dihidropirid\xEDnico con potente acci\xF3n depresora sobre el nodo sinoauricular, el nodo auriculoventricular y el inotropismo mioc\xE1rdico. Al combinarse con un betabloqueador (metoprolol), se produce un bloqueo dromotr\xF3pico y cronotr\xF3pico sin\xE9rgico aditivo, desencadenando bradicardia extrema, bloqueo auriculoventricular completo (paro sinusal o bloqueo AV de tercer grado) y colapso cardiovascular.`,actionPlan:`1. Rechazar el cambio a verapamilo mientras tome metoprolol.
2. Manejar el edema por amlodipino reduciendo la dosis a 5 mg o a\xF1adiendo un IECA/ARA-II para vasodilatar la v\xE9nula postcapilar.
3. Si fuera indispensable suspender el amlodipino, emplear otra familia compatible (tiazida o ARA-II) manteniendo el metoprolol.`,evidenceNotes:"Goodman & Gilman (14.\xAA ed.) y Gu\xEDas ESC 2024: la combinaci\xF3n de verapamilo o diltiazem con betabloqueadores est\xE1 formalmente desaconsejada por riesgo letal de bloqueo AV."},callouts:{explicacion:"El amlodipino abre la compuerta de entrada (arteriola) pero deja la compuerta de salida (v\xE9nula) igual: se encharca el capilar por presi\xF3n hidrost\xE1tica, no porque sobre agua. Verapamilo + Metoprolol frenan el nodo AV al doble: riesgo de marcapasos de urgencia.",mnemotecnia:'DHP ("-DIPINO") = Dilataci\xF3n Perif\xE9rica (edema en patas). NO-DHP (Verapamilo/Diltiazem) = Coraz\xF3n. "Verapamilo + Betabloqueador = Paro AV Seguro".',redFlag:"\xA1Alerta roja! Verapamilo o diltiazem intravenoso u oral junto con metoprolol o atenolol es una de las causas m\xE1s frecuentes de bloqueo AV completo yatrog\xE9nico en urgencias."}},{teamId:7,familyTitle:"EQUIPO 7 \xB7 BETABLOQUEADORES Y BLOQUEADORES \u03B1\u2081",codename:"Las crisis misteriosas",vignette:"Hombre de 40 a\xF1os que acude a urgencias por episodios parox\xEDsticos recurrentes de cefalea puls\xE1til intensa, sudoraci\xF3n profusa y palpitaciones taquic\xE1rdicas. Durante la valoraci\xF3n se registra una presi\xF3n arterial alarmante de 220/120 mmHg y taquicardia sinusal de 130 lpm. El m\xE9dico de guardia sospecha cl\xEDnicamente un feocromocitoma y, alarmado por la frecuencia cardiaca de 130 lpm y la hipertensi\xF3n, prescribe de inmediato propranolol 40 mg v\xEDa oral como f\xE1rmaco inicial.",patientData:{age:"40 a\xF1os",keyLab:"PA 220/120 mmHg | FC 130 lpm | Paroxismos de cefalea + diaforesis",clinicalFinding:"Sospecha feocromocitoma; m\xE9dico indica propranolol en monoterapia inicial"},guideQuestions:["\xBFCu\xE1l fue el grav\xEDsimo error farmacol\xF3gico cometido al administrar un betabloqueador no selectivo en esta sospecha cl\xEDnica?","\xBFCu\xE1l es la secuencia farmacol\xF3gica estricta obligatoria (el orden de bloqueo) y qu\xE9 advertencia de primera dosis acompa\xF1a a los bloqueadores \u03B1\u2081?"],expectedAnswer:{diagnosis:"Contraindicaci\xF3n absoluta de betabloqueo aislado en feocromocitoma (riesgo de crisis hipertensiva por vasoconstricci\xF3n \u03B1\u2081 no antagonizada).",pharmacologicalMechanism:'El feocromocitoma es un tumor neuroendocrino productor masivo de catecolaminas (adrenalina y noradrenalina). La noradrenalina estimula los receptores vasculares \u03B1\u2081 (vasoconstricci\xF3n) y la adrenalina estimula los receptores \u03B2\u2082 (vasodilataci\xF3n en lechos musculares) y \u03B2\u2081 (taquicardia). Si se administra un betabloqueador (propranolol) sin un bloqueo \u03B1 previo, se eliminan los efectos vasodilatadores mediados por \u03B2\u2082 y la ca\xEDda de la resistencia perif\xE9rica, dejando toda la carga masiva de catecolaminas actuando sobre los receptores \u03B1\u2081 vasculares sin oposici\xF3n alguna ("un-opposed alpha stimulation"). Esto provoca vasoconstricci\xF3n perif\xE9rica extrema, agravamiento explosivo de la crisis hipertensiva, hemorragia intracraneal o edema pulmonar agudo.',actionPlan:`1. Regla de oro: NUNCA betabloqueador antes de un bloqueo alfa completo. Secuencia: PRIMERO BLOQUEO ALFA, DESPU\xC9S BLOQUEO BETA (regla nemot\xE9cnica alfab\xE9tica: "A" antes de "B").
2. Iniciar primero un bloqueador \u03B1: antagonista irreversible como fenoxibenzamina o antagonista selectivo \u03B1\u2081 como doxazosina/prazosina durante al menos 10 a 14 d\xEDas.
3. Una vez alcanzado el bloqueo alfa adecuado y expandida la volemia, a\xF1adir el betabloqueador para controlar la taquicardia.
4. Advertencia: los bloqueadores \u03B1\u2081 producen "s\xEDncope de primera dosis" por ca\xEDda s\xFAbita del tono vascular; deben administrarse al acostarse con ingesta de agua.`,evidenceNotes:"Katzung (16.\xAA ed.) y Goodman & Gilman (14.\xAA ed.): el bloqueo beta aislado en feocromocitoma es un error cl\xE1sico de examen y de guardia con desenlace potencialmente mortal."},callouts:{explicacion:"La adrenalina del tumor empuja tanto acelerador (alfa = vasoconstricci\xF3n) como freno parcial (beta-2 = vasodilataci\xF3n). Si apagas beta con propranolol, dejas al receptor alfa libre para estrangular todas las arterias del cuerpo. La presi\xF3n sube a niveles mortales.",mnemotecnia:'ORDEN ALFAB\xC9TICO OBLIGATORIO: Primero "A" (Alfa-bloqueo: doxazosina/fenoxibenzamina), luego "B" (Betabloqueador). Jam\xE1s la B antes de la A.',redFlag:"\xA1Alerta roja! Propranolol o cualquier betabloqueador administrado solo ante sospecha de feocromocitoma es yatrogenia pura: desata crisis hipertensiva con edema agudo de pulm\xF3n o ictus."}},{teamId:8,familyTitle:"EQUIPO 8 \xB7 SIMPATICOL\xCDTICOS CENTRALES Y VASODILATADORES DIRECTOS",codename:"La suspensi\xF3n abrupta",vignette:"Paciente masculino de 52 a\xF1os con hipertensi\xF3n arterial severa que tomaba clonidina 0.6 mg/d\xEDa en dosis divididas junto con metoprolol. Debido a que se le termin\xF3 la receta durante el fin de semana, decide suspender bruscamente ambos f\xE1rmacos. Veinticuatro horas despu\xE9s es llevado de urgencia a choque: diafor\xE9tico, tembloroso, intensamente ansioso, con taquicardia sinusal de 135 lpm y cifras tensionales de 230/130 mmHg.",patientData:{age:"52 a\xF1os",keyLab:"PA 230/130 mmHg | FC 135 lpm | Sudoraci\xF3n, temblor distal, ansiedad extrema",clinicalFinding:"Suspensi\xF3n s\xFAbita de Clonidina 0.6 mg/d\xEDa + Metoprolol"},guideQuestions:["\xBFCu\xE1l es el mecanismo fisiopatol\xF3gico del s\xEDndrome de abstinencia/rebote por clonidina?","\xBFPor qu\xE9 intentar controlar la crisis con un betabloqueador solo es peligroso y cu\xE1l es el manejo m\xE9dico correcto?","Pregunta de bonificaci\xF3n: \xBFQu\xE9 reacci\xF3n inmunol\xF3gica adversa caracter\xEDstica distingue a la hidralazina cr\xF3nica y en qu\xE9 perfil metab\xF3lico de pacientes es m\xE1s frecuente?"],expectedAnswer:{diagnosis:"Crisis hipertensiva de rebote mediada por tormenta simp\xE1tica hiperadren\xE9rgica por retirada abrupta de clonidina.",pharmacologicalMechanism:`1. Mecanismo del rebote por clonidina: La clonidina es un agonista \u03B1\u2082 presin\xE1ptico que frena la liberaci\xF3n de noradrenalina desde las terminaciones nerviosas simp\xE1ticas centrales y perif\xE9ricas. La administraci\xF3n cr\xF3nica induce una regulaci\xF3n al alza (up-regulation) y supersensibilidad de los receptores adren\xE9rgicos postsin\xE1pticos y acumulaci\xF3n intracelular de noradrenalina en las ves\xEDculas presin\xE1pticas. Al retirar la clonidina bruscamente, se libera s\xFAbitamente el freno presin\xE1ptico: torrentes masivos de catecolaminas inundan la hendidura sin\xE1ptica e impactan sobre receptores hiperreactivos, desatando una tormenta adren\xE9rgica id\xE9ntica a un feocromocitoma.
2. Peligro del betabloqueador aislado: Al igual que en el feocromocitoma, dar un betabloqueador solo bloquea los receptores \u03B2\u2082 vasodilatadores, dejando la estimulaci\xF3n \u03B1\u2081 sin oposici\xF3n y elevando a\xFAn m\xE1s la resistencia vascular perif\xE9rica.
3. Tratamiento: Reiniciar la clonidina por v\xEDa oral si el paciente deglute, o administrar fentolamina (bloqueador \u03B1), labetalol (bloqueador mixto \u03B1/\u03B2) o nitroprusiato de sodio intravenoso. Solo se adiciona betabloqueador tras haber establecido el bloqueo \u03B1.
4. Bonificaci\xF3n Hidralazina: La hidralazina induce un S\xEDndrome de Lupus Farmacoinducido caracterizado por artralgias, mialgias, fiebre y serositis con presencia de anticuerpos antihistona positivos en m\xE1s del 95% de los casos. Es notablemente m\xE1s frecuente en pacientes "acetiladores lentos" (genotipo NAT2 lento), ya que su metabolismo hep\xE1tico depende de la N-acetiltransferasa.`,actionPlan:`1. No usar betabloqueadores solos.
2. Reiniciar clonidina o infusi\xF3n de labetalol / fentolamina / nitroprusiato.
3. Monitorizaci\xF3n invasiva continua de PA.
4. Para el futuro: educar sobre el retiro escalonado (tapering) a lo largo de 1-2 semanas y jam\xE1s suspender de golpe.`,evidenceNotes:"Goodman & Gilman (14.\xAA ed.) y Katzung (16.\xAA ed.): la retirada de clonidina debe ser gradual; el lupus por hidralazina correlaciona directamente con el fenotipo acetilador lento."},callouts:{explicacion:"La clonidina funcionaba como una presa que conten\xEDa un lago inmenso de noradrenalina. Al quitarla de golpe, la presa se rompe y la noradrenalina choca contra receptores que estaban hambrientos y ultrasensibles.",mnemotecnia:'CLONIDINA = "CLONA-FRENO": Si quitas el freno, te estrellas en 24 horas. HIDRALAZINA = "Histonas y Lupus en acetiladores lentos".',redFlag:"\xA1Alerta roja! Nunca suspendas clonidina de forma abrupta. Y si llega en crisis de rebote, jam\xE1s metas un betabloqueador solo."}}];var rs=[{id:1,citation:"Jones DW, et al. 2025 AHA/ACC Guideline for the Prevention, Detection, Evaluation and Management of High Blood Pressure in Adults. Hypertension. 2025;82(10):e212\u2013e316.",doi:"10.1161/HYP.0000000000000249",doiUrl:"https://doi.org/10.1161/HYP.0000000000000249"},{id:2,citation:"McEvoy JW, et al. 2024 ESC Guidelines for the management of elevated blood pressure and hypertension. Eur Heart J. 2024;45(38):3912\u20134018.",doi:"10.1093/eurheartj/ehae178",doiUrl:"https://doi.org/10.1093/eurheartj/ehae178"},{id:3,citation:"ONTARGET Investigators. Telmisartan, ramipril, or both in patients at high risk for vascular events. N Engl J Med. 2008;358:1547\u20131559.",doi:"10.1056/NEJMoa0801317",doiUrl:"https://doi.org/10.1056/NEJMoa0801317"},{id:4,citation:"Parving HH, et al. Cardiorenal end points in a trial of aliskiren for type 2 diabetes (ALTITUDE). N Engl J Med. 2012;367:2204\u20132213.",doi:"10.1056/NEJMoa1208799",doiUrl:"https://doi.org/10.1056/NEJMoa1208799"},{id:5,citation:"Williams B, et al. Spironolactone versus placebo, bisoprolol, and doxazosin in drug-resistant hypertension (PATHWAY-2). Lancet. 2015;386:20
